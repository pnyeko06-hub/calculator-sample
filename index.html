<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Calculator</title>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body>
        <h1>Calculator</h1>
        <form>
            <input type="text" id="num1" placeholder="Enter first number">
            <input type="text" id="num2" placeholder="Enter second number">
            <br><br>
            <button type="button" onclick="add()">Add</button>
            <button type="button" onclick="subtract()">Subtract</button>
            <button type="button" onclick="multiply()">Multiply</button>
            <button type="button" onclick="divide()">Divide</button>
        </form>
        <h2>Result: <span id="result"></span></h2>

        <script>
            function add() {
                var num1 = parseFloat(document.getElementById('num1').value);
                var num2 = parseFloat(document.getElementById('num2').value);
                document.getElementById('result').innerText = num1 + num2;
            }

            function subtract() {
                var num1 = parseFloat(document.getElementById('num1').value);
                var num2 = parseFloat(document.getElementById('num2').value);
                document.getElementById('result').innerText = num1 - num2;
            }

            function multiply() {
                var num1 = parseFloat(document.getElementById('num1').value);
                var num2 = parseFloat(document.getElementById('num2').value);
                document.getElementById('result').innerText = num1 * num2;
            }

            function divide() {
                var num1 = parseFloat(document.getElementById('num1').value);
                var num2 = parseFloat(document.getElementById('num2').value);
                if (num2 !== 0) {
                    document.getElementById('result').innerText = num1 / num2;
                } else {
                    document.getElementById('result').innerText = 'Error: Division by zero';
                }
            }
        </script>

</html>
